name: UPM Package Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    name: Validate UPM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package.json
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("package.json"))
          for f in ("name", "version", "displayName", "description", "unity"):
              assert f in d, f"package.json missing {f}"
          for s in d.get("samples", []):
              assert os.path.isdir(s["path"]), f"sample path missing: {s['path']}"
          print("package.json OK", d["name"], d["version"])
          PY

      - name: Every asset has a .meta (git installs ignore assets without one)
        run: |
          missing=0
          while IFS= read -r -d '' p; do
            case "$p" in *.meta) continue;; esac
            if [ ! -f "$p.meta" ]; then echo "missing meta: $p"; missing=1; fi
          done < <(find Runtime Editor Tests Documentation -name '*~' -prune -o -print0)
          for f in package.json README.md CHANGELOG.md LICENSE; do
            [ -f "$f.meta" ] || { echo "missing meta: $f"; missing=1; }
          done
          exit $missing

      - name: Native sources stay hidden from Unity
        run: |
          test -d "Native~" || { echo "Native~ missing"; exit 1; }
          test ! -d Native || { echo "Native/ would be imported by Unity (C++ becomes IL2CPP plugin sources)"; exit 1; }

      - name: Assembly definitions
        run: |
          for f in Runtime/com.lask3802.unaudio.asmdef Editor/com.lask3802.unaudio.editor.asmdef Tests/Editor/com.lask3802.unaudio.tests.editor.asmdef; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "OK $f"
          done
